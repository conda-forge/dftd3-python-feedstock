{% set name = "dftd3-python" %}
{% set version = "1.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/dftd3/dftd3-{{ version }}.tar.gz
  sha256: 189e5c20b27de8e674eb241de76d7a64902b80b550629d419297a000bfe3a19b
  folder: python

build:
  number: 3

requirements:
  build:
    - {{ compiler('c') }}  # [unix]
    - {{ compiler('m2w64_c') }}  # [win]
    - {{ stdlib('c') }}  # [unix]
    - {{ stdlib('m2w64_c') }}  # [win]
    - cffi                                # [build_platform != target_platform]
    - cross-python_{{ target_platform }}  # [build_platform != target_platform]
    - meson                               # [build_platform != target_platform]
    - meson-python                        # [build_platform != target_platform]
    - pkg-config
    - python                              # [build_platform != target_platform]
    - python-build                        # [build_platform != target_platform]
    - setuptools                          # [build_platform != target_platform]
  host:
    - cffi
    - meson
    - meson-python
    - pip
    - python
    - python-build
    - setuptools
    #- simple-dftd3 >={{ version }}
  run:
    - cffi
    - numpy
    - python


test:
  imports:
    - dftd3
    - dftd3.library
    - dftd3.interface
    - dftd3.parameters
    - dftd3.ase
    - dftd3.qcschema
  requires:
    - pytest
    - setuptools
    - qcelemental
    - ase
    - tomli
  commands:
    - python -c "from dftd3.parameters import get_all_damping_params as f; p=f(); print(len(p), 'e.g.', sorted(p)[:3])"

about:
  home: https://github.com/awvwgk/simple-dftd3/tree/main/python
  license: LGPL-3.0-or-later
  license_family: LGPL
  license_file:
    - COPYING
    - COPYING.LESSER
  summary: Python API for the DFT-D3 project

extra:
  recipe-maintainers:
    - awvwgk
